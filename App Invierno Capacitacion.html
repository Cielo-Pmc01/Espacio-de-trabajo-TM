const typeColors = { excursion: "#2563eb", traslado: "#059669", clase: "#d97706", seguro: "#7c3aed", alquiler: "#0891b2" };
const typeLabels = { excursion: "Excursión", traslado: "Traslado", clase: "Clase", seguro: "Seguro", alquiler: "Alquiler" };

let activeFilter = "all";
let activeProvider = "all";

function renderCards(filter, search) {
  const container = document.getElementById("cardsContainer");
  const noResults = document.getElementById("noResults");
  let filtered = products;
  if (filter !== "all") filtered = filtered.filter(p => p.type === filter);
  if (search) {
    const s = search.toLowerCase();
    filtered = filtered.filter(p => p.name.toLowerCase().includes(s) || p.description.toLowerCase().includes(s) || (p.provider && p.provider.toLowerCase().includes(s)));
  }
  container.innerHTML = "";
  noResults.classList.toggle("hidden", filtered.length > 0);
  filtered.forEach((p, i) => {
    const color = typeColors[p.type];
    const card = document.createElement("div");
    card.className = "card bg-white rounded-2xl shadow-md overflow-hidden cursor-pointer fade-in";
    card.style.animationDelay = `${i * 0.07}s`;
    card.style.opacity = "0";
    card.innerHTML = `
      <div class="p-5">
        <div class="flex items-start justify-between mb-3">
          <span class="text-3xl">${p.emoji}</span>
        </div>
        <div class="flex items-center gap-3 mb-3">
          <span class="tag" style="background:${color}15;color:${color}">${typeLabels[p.type]}</span>
          ${p.provider ? `<span class="tag" style="background:#f3f4f6;color:#4b5563">${p.provider}</span>` : ""}
        </div>
        <h3 class="font-bold text-slate-800 mb-2">${p.name}</h3>
        <p class="text-slate-500 text-sm mb-4 line-clamp-2">${p.description}</p>
        <div class="flex items-center gap-2 text-sm text-slate-500 mb-3">
          <i data-lucide="clock" style="width:14px;height:14px"></i>
          <span>${p.schedule}</span>
        </div>
        <div class="flex flex-wrap gap-1.5 mb-4">
          ${p.tags.map(t => `<span class="bg-slate-100 text-slate-600 text-xs font-medium px-2.5 py-1 rounded-full">${t}</span>`).join("")}
        </div>
        <div class="price-box">
          <div class="flex items-end justify-between">
            <div>
              <div class="text-sky-300 text-xs font-semibold mb-1">DESDE</div>
              <div class="text-2xl font-bold">${p.prices[0].price}</div>
              <div class="text-sky-300 text-xs">${p.prices[0].method}</div>
            </div>
            <button class="bg-white text-slate-800 text-sm font-semibold px-4 py-2 rounded-xl hover:bg-sky-50 transition flex items-center gap-1.5" onclick="event.stopPropagation();openModal(${p.id})">
              Ver detalle <i data-lucide="chevron-right" style="width:14px;height:14px"></i>
            </button>
          </div>
          ${p.freeAge ? `<div class="text-sky-200 text-xs mt-2">👶 ${p.freeAge}</div>` : ""}
        </div>
      </div>
    `;
    card.addEventListener("click", () => openModal(p.id));
    container.appendChild(card);
  });
  lucide.createIcons();
}

function renderProvidersView() {
  const productsView = document.getElementById("productsView");
  const providersView = document.getElementById("providersView");
  const providersContainer = document.getElementById("providersContainer");
  
  productsView.classList.add("hidden");
  providersView.classList.remove("hidden");
  
  const uniqueProviders = [...new Set(products.filter(p => p.provider).map(p => p.provider))].sort();
  
  providersContainer.innerHTML = "";
  uniqueProviders.forEach((provider, i) => {
    const providerProducts = products.filter(p => p.provider === provider);
    const section = document.createElement("div");
    section.className = "fade-in";
    section.style.animationDelay = `${i * 0.07}s`;
    section.style.opacity = "0";
    
    section.innerHTML = `
      <div class="bg-white rounded-2xl shadow-md overflow-hidden">
        <div class="bg-gradient-to-r from-purple-600 to-purple-500 p-5 cursor-pointer hover:from-purple-700 hover:to-purple-600 transition" onclick="toggleProvider(this)">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-2xl">🏢</span>
              <div>
                <h3 class="font-bold text-white text-lg">${provider}</h3>
                <p class="text-purple-100 text-sm">${providerProducts.length} producto${providerProducts.length > 1 ? 's' : ''}</p>
              </div>
            </div>
            <i data-lucide="chevron-down" style="width:24px;height:24px" class="text-white transition-transform duration-300"></i>
          </div>
        </div>
        <div class="products-list hidden max-h-0 overflow-hidden transition-all duration-300" style="max-height: 0;">
          <div class="p-4 space-y-3"></div>
        </div>
      </div>
    `;
    
    providersContainer.appendChild(section);
  });
  
  lucide.createIcons();
}

function toggleProvider(header) {
  const section = header.closest(".bg-white");
  const productsList = section.querySelector(".products-list");
  const productsContent = productsList.querySelector(".p-4");
  const chevron = header.querySelector("[data-lucide='chevron-down']");
  
  if (productsList.classList.contains("hidden")) {
    productsList.classList.remove("hidden");
    const provider = header.querySelector("h3").textContent;
    const providerProducts = products.filter(p => p.provider === provider);
    
    productsContent.innerHTML = "";
    providerProducts.forEach(p => {
      const color = typeColors[p.type];
      const productItem = document.createElement("div");
      productItem.className = "border border-slate-200 rounded-lg p-3 hover:shadow-md transition cursor-pointer";
      productItem.innerHTML = `
        <div class="flex items-start justify-between mb-2" onclick="openModal(${p.id})">
          <div class="flex items-center gap-2 flex-1">
            <span class="text-xl">${p.emoji}</span>
            <div class="flex-1">
              <h4 class="font-bold text-slate-800 text-sm">${p.name}</h4>
              <span class="tag" style="background:${color}15;color:${color};font-size:11px;padding:2px 8px">${typeLabels[p.type]}</span>
            </div>
          </div>
        </div>
        <p class="text-xs text-slate-600 mb-2">${p.description.substring(0, 80)}...</p>
        <div class="flex items-center justify-between">
          <div class="text-xs text-slate-500">Desde <span class="font-bold text-slate-700">${p.prices[0].price}</span></div>
          <button class="text-sky-600 font-semibold text-xs hover:text-sky-700 flex items-center gap-1" onclick="event.stopPropagation();openModal(${p.id})">
            Ver detalle <i data-lucide="arrow-right" style="width:12px;height:12px"></i>
          </button>
        </div>
      `;
      productsContent.appendChild(productItem);
    });
    
    setTimeout(() => {
      productsList.style.maxHeight = productsContent.scrollHeight + 20 + "px";
    }, 0);
    chevron.style.transform = "rotate(180deg)";
  } else {
    productsList.style.maxHeight = "0px";
    chevron.style.transform = "rotate(0deg)";
    setTimeout(() => {
      productsList.classList.add("hidden");
    }, 300);
  }
  
  lucide.createIcons();
}

      </div>
      ${p.additional ? `<div class="mb-5"><h3 class="text-sm font-bold text-amber-600 flex items-center gap-1.5 mb-2"><i data-lucide="info" style="width:16px;height:16px"></i> Adicionales</h3><ul class="space-y-1">${p.additional.map(i => `<li class="text-sm text-slate-600 flex items-start gap-2"><span class="text-amber-500 mt-0.5">•</span>${i}</li>`).join("")}</ul></div>` : ""}

      <div class="price-box">

        ${p.prices.map(pr => `<div class="flex justify-between items-center mb-2"><span class="text-sm text-sky-100">${pr.method}</span><span class="font-bold text-lg">${pr.price}</span></div>`).join("")}

  lucide.createIcons();

document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});

document.getElementById("filterTabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  activeFilter = btn.dataset.filter;
  renderCards(activeFilter, document.getElementById("searchInput").value);
});

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("providersBtn").classList.add("active");
  renderProvidersView();
});

document.getElementById("filterTabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab-btn");
  if (!btn) return;
  document.getElementById("providersBtn").classList.remove("active");

  const providersView = document.getElementById("providersView");
